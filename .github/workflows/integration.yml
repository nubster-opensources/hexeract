name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  integration:
    name: Integration tests on Linux with Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: integration

      - name: Verify Docker daemon is available
        run: docker version

      - name: Run #[ignore]-d integration tests concurrently
        run: |
          started_at=$(date +%s)
          cargo test --workspace --all-features --no-fail-fast -- --ignored
          elapsed_seconds=$(( $(date +%s) - started_at ))
          {
            echo "### Docker integration duration"
            echo
            echo "- Ignored integration suite: ${elapsed_seconds}s"
            echo "- Baseline before parallel execution: 13m41s (821s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run self-asserting examples
        run: |
          cargo run --example 01_command_handler   -p hexeract-examples
          cargo run --example 02_outbox_transactional -p hexeract-examples
          cargo run --example 03_bus_pubsub          -p hexeract-examples
          cargo run --example 04_bus_mediator        -p hexeract-examples
          cargo run --example 05_orders_to_payments  -p hexeract-examples
          cargo run --example 06_scheduled_reminder  -p hexeract-examples
          cargo run --example 07_request_reply       -p hexeract-examples
