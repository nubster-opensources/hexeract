[package]
name = "hexeract-umbrella-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hexeract = { path = "../hexeract", version = "0.6", default-features = false }

[dev-dependencies]
tokio = { workspace = true }

# One feature per public feature of the `hexeract` facade, forwarded to it. The
# guard test in `tests/feature_guard.rs` keeps the two lists identical.
[features]
default = []
core = ["hexeract/core"]
outbox = ["hexeract/outbox"]
outbox-sql-postgres = ["hexeract/outbox-sql-postgres"]
outbox-sql-mysql = ["hexeract/outbox-sql-mysql"]
outbox-sql-sqlite = ["hexeract/outbox-sql-sqlite"]
bus = ["hexeract/bus"]
bus-rabbitmq = ["hexeract/bus-rabbitmq"]
mediator = ["hexeract/mediator"]
macros = ["hexeract/macros"]
middleware = ["hexeract/middleware"]
scheduler = ["hexeract/scheduler"]
scheduler-mediator = ["hexeract/scheduler-mediator"]
scheduler-bus = ["hexeract/scheduler-bus"]
scheduler-outbox = ["hexeract/scheduler-outbox"]
scheduler-sql-postgres = ["hexeract/scheduler-sql-postgres"]
scheduler-sql-mysql = ["hexeract/scheduler-sql-mysql"]
scheduler-sql-sqlite = ["hexeract/scheduler-sql-sqlite"]

# Each facade test compiles only with the features it exercises. Cargo skips a
# test whose required features are off, instead of compiling an empty crate.

[[test]]
name = "feature_bus"
required-features = ["bus"]

[[test]]
name = "feature_bus_rabbitmq"
required-features = ["bus-rabbitmq"]

[[test]]
name = "feature_core"
required-features = ["core"]

[[test]]
name = "feature_macros"
required-features = ["macros"]

[[test]]
name = "feature_mediator"
required-features = ["mediator"]

[[test]]
name = "feature_middleware"
required-features = ["middleware"]

[[test]]
name = "feature_outbox"
required-features = ["outbox"]

[[test]]
name = "feature_outbox_sql_mysql"
required-features = ["outbox-sql-mysql"]

[[test]]
name = "feature_outbox_sql_postgres"
required-features = ["outbox-sql-postgres"]

[[test]]
name = "feature_outbox_sql_sqlite"
required-features = ["outbox-sql-sqlite"]

[[test]]
name = "feature_scheduler"
required-features = ["scheduler"]

[[test]]
name = "feature_scheduler_bus"
required-features = ["scheduler-bus"]

[[test]]
name = "feature_scheduler_mediator"
required-features = ["scheduler-mediator"]

[[test]]
name = "feature_scheduler_outbox"
required-features = ["scheduler-outbox"]

[[test]]
name = "feature_scheduler_sql_mysql"
required-features = ["scheduler-sql-mysql"]

[[test]]
name = "feature_scheduler_sql_postgres"
required-features = ["scheduler-sql-postgres"]

[[test]]
name = "feature_scheduler_sql_sqlite"
required-features = ["scheduler-sql-sqlite"]

[[test]]
name = "scheduler"
required-features = ["scheduler"]

[[test]]
name = "umbrella"
required-features = ["macros", "mediator"]
