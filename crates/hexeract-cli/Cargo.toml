[package]
name = "hexeract-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Hexeract unified command-line interface"
readme = "../../README.md"
exclude = ["/tests", "/examples", "/benches"]
keywords = ["messaging", "cli", "outbox", "hexeract"]
categories = ["command-line-utilities", "asynchronous"]

[[bin]]
name = "hexeract"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hexeract-bus = { path = "../hexeract-bus", version = "0.6" }
hexeract-bus-rabbitmq = { path = "../hexeract-bus-rabbitmq", version = "0.6" }
hexeract-outbox = { path = "../hexeract-outbox", version = "0.6" }
hexeract-outbox-sql = { path = "../hexeract-outbox-sql", version = "0.6", default-features = false, features = ["postgres"] }
hexeract-scheduler = { path = "../hexeract-scheduler", version = "0.6" }
hexeract-scheduler-sql = { path = "../hexeract-scheduler-sql", version = "0.6", default-features = false, features = ["postgres", "mysql", "sqlite"] }
clap = { workspace = true }
lapin = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "mysql", "sqlite", "uuid"] }
time = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
toml = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["rabbitmq", "postgres"] }
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
